<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Another picture</title>
</head>

<body>
  <img id="toggle-image" src="https://media.tenor.com/o5Br6wYGkzIAAAAC/rainbow-boa-brazillian-rainbow-boa.gif"
    alt="A dog" style="cursor:pointer; max-width:100%; display:block;">

  <script>
    const toggleImage = document.getElementById('toggle-image');
    const originalSrc = 'https://media.tenor.com/o5Br6wYGkzIAAAAC/rainbow-boa-brazillian-rainbow-boa.gif';
    const gifSrc = 'https://media.tenor.com/QA6mPKs100UAAAAC/caught-in.gif';
    const homeUrl = 'index.html';
    let showingGif = false;

    toggleImage.addEventListener('click', () => {
      if (showingGif) {
        window.location.href = homeUrl;
        return;
      }

      toggleImage.src = gifSrc;
      showingGif = true;
    });

    toggleImage.addEventListener('dblclick', () => {
      toggleImage.src = originalSrc;
      showingGif = false;
    });
  </script>
</body>

</html>
